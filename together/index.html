<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer - Together</title>
  <style>
    :root { color-scheme: light; --ink: #262b27; --muted: #777d75; --paper: #f6f4ee; --card: #fffefa; --accent: #d66b4d; --accent-dark: #b9573d; --line: #e9e5dc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 18px; color: var(--ink); background: radial-gradient(ellipse at 15% 10%, #efe1ce 0, transparent 29rem), radial-gradient(ellipse at 90% 95%, #e7eadf 0, transparent 25rem), var(--paper); }
    main { width: min(100%, 470px); }
    .eyebrow { margin: 0 0 9px; color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 500; letter-spacing: -.055em; }
    .hint { margin: 8px 0 24px; color: var(--muted); }
    .timer-card { padding: 26px; border: 1px solid #ffffffc9; border-radius: 25px; background: color-mix(in srgb, var(--card) 94%, transparent); box-shadow: 0 28px 80px #473b2915; }
    .mode-chip { width: fit-content; margin: 0 auto; padding: 7px 13px; border: 1px solid #f0d9ce; border-radius: 99px; background: #fcf0e9; color: var(--accent-dark); font-size: .78rem; font-weight: 700; letter-spacing: .04em; }
    .dial { --progress: 0%; position: relative; display: grid; place-items: center; width: min(100%, 280px); aspect-ratio: 1; margin: 24px auto; border-radius: 50%; background: conic-gradient(var(--accent) var(--progress), #eeeae2 0); }
    .dial::before { position: absolute; inset: 9px; border-radius: inherit; background: var(--card); content: ""; }
    .dial-center { position: relative; text-align: center; }
    #clock { font-size: clamp(4.2rem, 18vw, 5.25rem); font-weight: 650; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; }
    #timerCaption { margin: 11px 0 0; color: var(--muted); font-size: .87rem; }
    .actions { display: flex; justify-content: center; align-items: center; gap: 10px; }
    button, input { font: inherit; }
    button { min-height: 45px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 11px; background: white; color: var(--ink); cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
    button:hover { transform: translateY(-1px); background: #f8f6f1; }
    button:focus-visible, input:focus-visible { outline: 3px solid #d66b4d55; outline-offset: 2px; }
    button.primary { min-width: 128px; border-color: var(--accent); background: var(--accent); color: white; font-weight: 700; box-shadow: 0 7px 17px #d66b4d33; }
    button.primary:hover { background: var(--accent-dark); }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 26px; padding-top: 21px; border-top: 1px solid var(--line); }
    label { display: grid; gap: 7px; color: var(--muted); font-size: .8rem; }
    input { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: white; color: var(--ink); }
    .rounds { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 17px 3px 0; color: var(--muted); font-size: .88rem; }
    .rounds strong { color: var(--ink); }
    #syncStatus { display: block; margin: 7px 3px 0; color: var(--muted); font-size: .78rem; }
    @media (max-width: 420px) { .timer-card { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little room to focus</p>
    <h1>Focus, gently.</h1>
    <p class="hint">One focused step at a time adds up to big progress.</p>
    <section class="timer-card" aria-label="Pomodoro timer">
      <p class="mode-chip" id="mode">Focus Time</p>
      <div class="dial" id="dial" role="timer" aria-live="polite" aria-label="Time remaining">
        <div class="dial-center"><div id="clock">25:00</div><p id="timerCaption">Ready when you are</p></div>
      </div>
      <div class="actions">
        <button class="primary" id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
      </div>
      <div class="settings">
        <label>Focus duration (minutes)<input id="focus" type="number" min="1" max="180" value="25"></label>
        <label>Break duration (minutes)<input id="break" type="number" min="1" max="60" value="5"></label>
      </div>
    </section>
    <p class="rounds"><span>Focus rounds completed today</span><strong id="rounds">0</strong></p>
    <span id="syncStatus" role="status">Connecting to the local session service...</span>
  </main>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const state = { mode: "focus", seconds: 25 * 60, rounds: 0, interval: null, totalSeconds: 25 * 60 };

    function minutesForMode() {
      const input = state.mode === "focus" ? $("#focus") : $("#break");
      const maximum = state.mode === "focus" ? 180 : 60;
      const value = Math.floor(Number(input.value));
      return Number.isFinite(value) && value > 0 ? Math.min(value, maximum) : (state.mode === "focus" ? 25 : 5);
    }

    function render() {
      const minutes = Math.floor(state.seconds / 60);
      const seconds = state.seconds % 60;
      $("#clock").textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      $("#mode").textContent = state.mode === "focus" ? "Focus Time" : "Break Time";
      $("#dial").style.setProperty("--progress", `${((state.totalSeconds - state.seconds) / state.totalSeconds) * 100}%`);
      $("#timerCaption").textContent = state.interval ? "Take it one minute at a time" : "Ready when you are";
      $("#rounds").textContent = state.rounds;
    }

    function stop() {
      if (state.interval !== null) clearInterval(state.interval);
      state.interval = null;
    }

    function reset() {
      stop();
      state.seconds = minutesForMode() * 60;
      state.totalSeconds = state.seconds;
      render();
    }

    async function loadTodayRounds() {
      try {
        const response = await fetch("/api/sessions");
        if (!response.ok) throw new Error("Could not load sessions");
        const { sessions } = await response.json();
        const today = new Date().toLocaleDateString();
        state.rounds = sessions.filter((session) =>
          new Date(session.completedAt).toLocaleDateString() === today
        ).length;
        $("#syncStatus").textContent = "Completed sessions are saved locally.";
        render();
      } catch {
        $("#syncStatus").textContent = "Session service is unavailable. The timer is still usable.";
      }
    }

    async function saveFocusRound(durationSeconds) {
      try {
        const response = await fetch("/api/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: "focus", durationSeconds }),
        });
        if (!response.ok) throw new Error("Could not save session");
        $("#syncStatus").textContent = "This round has been saved locally.";
      } catch {
        $("#syncStatus").textContent = "Round complete, but saving failed. Check that the server is running.";
      }
    }

    function finishRound() {
      stop();
      if (state.mode === "focus") {
        state.rounds += 1;
        void saveFocusRound(state.totalSeconds);
        state.mode = "break";
      } else {
        state.mode = "focus";
      }
      reset();
      alert(state.mode === "break" ? "Focus session complete. Take a break!" : "Break is over. Keep going!");
    }

    function tick() {
      state.seconds -= 1;
      if (state.seconds <= 0) {
        state.seconds = 0;
        render();
        finishRound();
      } else {
        render();
      }
    }

    $("#start").addEventListener("click", () => {
      if (state.interval === null) {
        state.interval = setInterval(tick, 1000);
        render();
      }
    });
    $("#pause").addEventListener("click", () => { stop(); render(); });
    $("#reset").addEventListener("click", reset);
    $("#focus").addEventListener("change", reset);
    $("#break").addEventListener("change", reset);
    render();
    void loadTodayRounds();
  </script>
</body>
</html>
