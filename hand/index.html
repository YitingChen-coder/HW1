<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer - Hand</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 45px auto; padding: 20px; color: #292929; background: #f4f4f4; }
    main { background: white; padding: 28px; border: 1px solid #ddd; }
    h1 { margin-top: 0; }
    #clock { font-size: 76px; font-weight: bold; margin: 24px 0; }
    button { padding: 10px 16px; margin: 3px; cursor: pointer; }
    input { width: 55px; padding: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>My Pomodoro Timer</h1>
    <p id="mode">Focus Time</p>
    <div id="clock">25:00</div>
    <button id="go">Start</button>
    <button id="stop">Pause</button>
    <button id="again">Reset</button>
    <p>Focus minutes <input id="focusLen" type="number" value="25" min="1"></p>
    <p>Break minutes <input id="breakLen" type="number" value="5" min="1"></p>
    <p>Completed rounds today: <span id="count">0</span></p>
    <p id="saveNote" role="status">Connecting to the local session service...</p>
  </main>
  <script>
    let miao = 25 * 60;
    let zhuangtai = "focus";
    let ding = null;
    let ci = 0;
    const clock = document.querySelector("#clock");
    const mode = document.querySelector("#mode");

    function showIt() {
      let mm = Math.floor(miao / 60);
      let ss = miao % 60;
      clock.textContent = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
      mode.textContent = zhuangtai === "focus" ? "Focus Time" : "Break Time";
    }

    function resetIt() {
      clearInterval(ding);
      ding = null;
      const n = zhuangtai === "focus" ? Number(document.querySelector("#focusLen").value) : Number(document.querySelector("#breakLen").value);
      miao = Math.max(1, n) * 60;
      showIt();
    }

    async function loadRounds() {
      try {
        const response = await fetch("/api/sessions");
        if (!response.ok) throw new Error("Could not load sessions");
        const data = await response.json();
        const today = new Date().toLocaleDateString();
        ci = data.sessions.filter(function (session) {
          return new Date(session.completedAt).toLocaleDateString() === today;
        }).length;
        document.querySelector("#count").textContent = ci;
        document.querySelector("#saveNote").textContent = "Completed sessions are saved locally.";
      } catch (error) {
        document.querySelector("#saveNote").textContent = "Server unavailable. The timer still works, but rounds will not be saved.";
      }
    }

    async function saveRound(seconds) {
      try {
        const response = await fetch("/api/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: "focus", durationSeconds: seconds })
        });
        if (!response.ok) throw new Error("Could not save session");
        document.querySelector("#saveNote").textContent = "This focus round was saved.";
      } catch (error) {
        document.querySelector("#saveNote").textContent = "Round complete, but saving failed. Check the server.";
      }
    }

    document.querySelector("#go").onclick = function () {
      if (ding) return;
      ding = setInterval(function () {
        miao = miao - 1;
        if (miao <= 0) {
          clearInterval(ding);
          ding = null;
          if (zhuangtai === "focus") {
            ci = ci + 1;
            document.querySelector("#count").textContent = ci;
            void saveRound(Math.max(1, Number(document.querySelector("#focusLen").value)) * 60);
            zhuangtai = "break";
          } else {
            zhuangtai = "focus";
          }
          resetIt();
          alert("This session is complete!");
        }
        showIt();
      }, 1000);
    };
    document.querySelector("#stop").onclick = function () { clearInterval(ding); ding = null; };
    document.querySelector("#again").onclick = resetIt;
    document.querySelector("#focusLen").onchange = resetIt;
    document.querySelector("#breakLen").onchange = resetIt;
    showIt();
    void loadRounds();
  </script>
</body>
</html>
